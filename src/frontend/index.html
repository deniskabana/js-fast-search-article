<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search demo</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="group">
          <button class="button" id="load">Load data</button>
          <input type="checkbox" id="simulateDelay" checked />
          <label for="simulateDelay">Simulate delay on server</label>
        </div>

        <div class="loader" id="loading"></div>

        <input class="text-field" type="text" id="search-input" placeholder="Search (whitespace separated)" />

        <div class="search-results-container" id="results-container">
          <table id="search-results">
            <thead class="text">
              <tr>
                <th></th>
                <th colspan="2">Name</th>
                <th>Slug</th>
                <th>EAN</th>
              </tr>
            </thead>
            <tbody id="results-table"></tbody>
          </table>
          <p class="text" id="no-results">No results found.</p>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
